spring:
  application:
    name: payment-orchestrator

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DATABASE_USERNAME:payments}
    # No default on purpose: if the password is not provided by the environment, the app fails to start.
    password: ${DATABASE_PASSWORD}

  jpa:
    # Disables the anti-pattern of keeping the Hibernate session open until view/serialization.
    open-in-view: false
    hibernate:
      # Flyway creates and alters tables; Hibernate only checks that the entities match.
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  devtools:
    livereload:
      enabled: false
    restart:
      # Restart only after docker/dev.sh finishes a successful compilation.
      trigger-file: .reloadtrigger

server:
  # Finish in-flight requests before shutting down (important for payments).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
