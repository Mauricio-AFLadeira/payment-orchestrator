name: payment-orchestrator

services:
  app:
    build:
      context: .
      target: dev
    # tini as PID 1: forwards signals (graceful shutdown) and reaps orphan processes.
    init: true
    environment:
      # The database host is the compose service name, not localhost.
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-payments}
      DATABASE_USERNAME: ${POSTGRES_USER:-payments}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    volumes:
      - .:/app
      - maven-repo:/home/app/.m2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Since Postgres 18 the volume is mounted at /var/lib/postgresql (no longer .../data).
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  maven-repo:
